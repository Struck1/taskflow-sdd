spring:
  application:
    name: taskflow-pro
  jpa:
    # Flyway owns the schema; Hibernate only checks it (tech-stack.md).
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
